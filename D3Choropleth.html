<!DOCTYPE html>
<meta charset="utf-8">

<head>
         <title>Bivariate Choropleth Map of Education vs Income</title>

            <script src="https://d3js.org/d3.v7.js"></script>
            <script src="https://d3js.org"></script>
            <script src="https://unpkg.com"></script>
            <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
path {
  stroke: black;
  stroke-width: 0.5;
  stroke-linejoin: round;
  transition: stroke 0.2s, stroke-width 0.2s;
}

path:hover {
  stroke: #333333; 
    stroke-width: 2;
  cursor: pointer;
}

</style>
</head>
<body>
<script>

const API_KEY = 'Your_API_Key'

var margin = {top: 100, right:130, bottom:100, left:80},
    width = 1100 - margin.left - margin.right,
    height = 700 - margin.top - margin.bottom;    

var svg = d3.select("body").append("svg")
    .attr("id", "map")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)

const API_URL = `https://api.census.gov/data/2023/acs/acs5/profile?get=NAME,DP02_0068PE,DP03_0062E&for=state:*&key=${API_KEY}`;

const colors = [
  "#e8e8e8", "#ace2e2", "#5ac8c8", 
  "#dfb0d6", "#a5add3", "#5698b9", 
  "#be64ac", "#8c62aa", "#3b4994"  
];

const colorValue = (d) => {
  const edIdx = xThresholdScale(d.education); 
  const incIdx = yThresholdScale(d.income); 
  return colors[incIdx * 3 + edIdx]; 
};

async function getCensusData() {
  try {
    const response = await fetch(API_URL);
    const rawData = await response.json();

    const formattedData = rawData.slice(1).map(d => ({
      name: d[0],
      education: +d[1], 
      income: +d[2],    
      fips: d[3] 
    }));

    console.log(formattedData);
    return formattedData;
  } catch (error) {
    console.error("Error fetching Census data:", error);
  }
}

const xThresholdScale = d3.scaleQuantile();
const yThresholdScale = d3.scaleQuantile();

Promise.all([
  d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json"),
  getCensusData() 
]).then(([us, censusData]) => {
  
  xThresholdScale.domain(censusData.map(d => d.education)).range([0, 1, 2]);
  yThresholdScale.domain(censusData.map(d => d.income)).range([0, 1, 2]);

  const dataMap = new Map(censusData.map(d => [d.fips, d]));

  const path = d3.geoPath();

  svg.append("g")
    .selectAll("path")
    .data(topojson.feature(us, us.objects.states).features)
    .join("path")
    .attr("d", path)
    .attr("fill", d => {
      const entry = dataMap.get(d.id); 
      if (entry) {
        const edIdx = xThresholdScale(entry.education);
        const incIdx = yThresholdScale(entry.income);
        return colors[incIdx * 3 + edIdx];
      }
      return "#ccc"; 
    })
    .append("title") 
    .text(d => {
      const entry = dataMap.get(d.id);
      return entry ? `${entry.name}\nEd: ${entry.education}%\nInc: $${entry.income.toLocaleString()}` : d.id;
    });

    const legendSize = 120;

const legendG = svg.append("g")
    .attr("transform", `translate(${width + 50}, ${height - 50})`); 

const side = 25;

const matrixG = legendG.append("g")
    .attr("transform", "rotate(-45)");

d3.cross(d3.range(3), d3.range(3)).forEach(([i, j]) => {
  matrixG.append("rect")
    .attr("width", side)
    .attr("height", side)
    .attr("x", i * side)
    .attr("y", (2 - j) * side)
    .attr("fill", colors[j * 3 + i]);
});

const labelStyle = { "font-size": "12px", "font-weight": "bold", "text-anchor": "middle" };

legendG.append("text")
    .attr("x", 50)
    .attr("y", -side * 2.5)
    .attr("dy", "0.35em")
    .style("font-size", "10px")
    .attr("text-anchor", "middle")
    .text("High Income");

legendG.append("text")
    .attr("x", 50)
    .attr("y", side * 2.5)
    .attr("dy", "0.35em")
    .style("font-size", "10px")
    .attr("text-anchor", "middle")
    .text("Low Income");

legendG.append("text")
    .attr("x", side * 4.5)
    .attr("y", side * .1)
    .attr("dy", "0.35em")
    .style("font-size", "10px")
    .attr("text-anchor", "start")
    .text("High Ed →");

legendG.append("text")
    .attr("x", -side * 0.4)
    .attr("y", side * 0.1)
    .attr("dy", "0.35em")
    .style("font-size", "10px")
    .attr("text-anchor", "end")
    .text("← Low Ed");

svg.append("text")
    .attr("dx", width - 350)
    .attr("dy", 30)
    .attr("id", "title")
    .style("text-anchor", "middle")
    .style("font-size", "25")
    .text("US Education vs Income (2023)")

svg.append("text")
    .attr("dx", margin.left)
    .attr("dy", margin.bottom + 550)
    .attr("id", "description")
    .style("text-anchor", "left")
    .style("font-size", "18")
    .text("Education (percent of adults with a Bachelor's degree or higher) and Income (average annual adult wage)")

})
  </script>
</body>
</html>
